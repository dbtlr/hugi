name: Release

# A vX.Y.Z tag publishes a release in the shape Loom's install.sh reads: hugi-darwin-arm64 and a
# one-line SHA256SUMS (README, "Installing a release"). The binary is cross-compiled on Linux, so
# no step waits on a hosted macOS runner. Pull requests that touch the release path run the build
# and its checks without publishing; CI already runs check and test on every pull request.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'bun.lock'
      - 'install.sh'
      - 'mise.toml'
      - 'package.json'
      - 'scripts/release/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build:
    name: build hugi-darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in step with mise.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        if: github.ref_type == 'tag'
        run: bun run check

      - name: Test
        if: github.ref_type == 'tag'
        run: bun run test

      - name: Compile
        run: bun x loom build --release --target bun-darwin-arm64 --out dist/hugi-darwin-arm64

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum hugi-darwin-arm64 > SHA256SUMS

      # Refuses a binary that is not arm64 or whose signature does not cover its code, a SHA256SUMS
      # other than the release shape's one line, and, on a tag, a tag that is not
      # v<digits>.<digits>.<digits> or differs from package.json's version.
      - name: Check the release
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bun scripts/release/main.ts dist ${TAG:+"$TAG"}

      # The darwin binary cannot run here, so a release build for this runner shows that a release
      # build starts and prints exactly the version it was built from.
      - name: Check a release build prints its version
        run: |
          set -euo pipefail
          bun x loom build --release --target bun-linux-x64 --out "$RUNNER_TEMP/hugi-linux-x64"
          expected=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          actual=$("$RUNNER_TEMP/hugi-linux-x64" --version)
          test "$actual" = "$expected" || { echo "::error::--version printed '$actual', not '$expected'."; exit 1; }

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/hugi-darwin-arm64
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time across all tags, queued rather than cancelled, so each run's
    # forward-only check sees every release published before it.
    concurrency:
      group: release-publish
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # A re-run publishes the artifact built for this run's commit, so the tag must still name it.
      - name: Refuse a tag that moved off this commit
        run: |
          set -euo pipefail
          refs=$(git ls-remote "https://github.com/$GH_REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          peeled=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')
          direct=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')
          target=${peeled:-$direct}
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG names ${target:-nothing}, not $GITHUB_SHA, the commit this run built."
            exit 1
          fi

      # Reads every release, so a failed read fails the step instead of passing for "none". A
      # published release for the tag is never replaced, and releases only move forward, so the
      # highest published version is always the latest. Any draft for the tag is deleted.
      - name: Refuse a published or older release, delete drafts for the tag
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | [.id, .tag_name, .draft, .prerelease] | @tsv')
          highest=
          while IFS="$(printf '\t')" read -r id tag draft prerelease; do
            [ -n "$id" ] || continue
            if [ "$tag" = "$TAG" ] && [ "$draft" = true ]; then
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
              continue
            fi
            if [ "$tag" = "$TAG" ]; then
              echo "::error::The release $TAG is already published; cut a new patch release instead."
              exit 1
            fi
            if [ "$draft" = false ] && [ "$prerelease" = false ]; then
              highest=$(printf '%s\n%s\n' "$highest" "$tag" | sed '/^$/d' | sort -V | tail -n 1)
            fi
          done <<< "$releases"
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "::error::$TAG is not above $highest, the highest published release; releases only move forward."
            exit 1
          fi

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Create the draft release
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes dist/hugi-darwin-arm64 dist/SHA256SUMS

      # The tag now has exactly this one draft, so every later command reaches it.
      - name: Find the draft
        id: draft
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ] || [ "$(printf '%s\n' "$ids" | cut -f 2)" != true ]; then
            echo "::error::Expected one draft release for $TAG, found: ${ids:-none}"
            exit 1
          fi
          echo "id=$(printf '%s\n' "$ids" | cut -f 1)" >> "$GITHUB_OUTPUT"

      # Publish only what reads back intact.
      - name: Verify the uploaded files
        run: |
          set -euo pipefail
          mkdir uploaded
          gh release download "$TAG" --dir uploaded
          (cd uploaded && sha256sum --check --strict SHA256SUMS)
          cmp dist/SHA256SUMS uploaded/SHA256SUMS
          cmp dist/hugi-darwin-arm64 uploaded/hugi-darwin-arm64
          test "$(find uploaded -mindepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = "SHA256SUMS hugi-darwin-arm64 "

      - name: Publish the release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
